name: Temporary Threads Downloader V2 Shortcut Signing
on:
  push:
    branches:
      - temp/threads-v2-sign-20261018
    paths:
      - .github/workflows/temporary-threads-v2-sign.yml

permissions:
  contents: write

jobs:
  sign-shortcut:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Restore and validate unsigned V2
        shell: bash
        env:
          SHORTCUT_BASE64: 
        run: |
          mkdir -p shortcuts
          python3 - <<'PY'
          import base64
          import os
          import plistlib
          from pathlib import Path
          data = base64.b64decode(os.environ["SHORTCUT_BASE64"], validate=True)
          shortcut = plistlib.loads(data)
          assert shortcut["WFWorkflowName"] == "Threads Downloader V2"
          assert len(shortcut["WFWorkflowActions"]) == 2
          assert shortcut["WFWorkflowTypes"] == ["ActionExtension"]
          Path("shortcuts/Threads_Downloader_V2_UNSIGNED_source.shortcut").write_bytes(data)
          print("Unsigned shortcut validated:", len(data), "bytes")
          PY
      - name: Sign for anyone using Apple Shortcuts
        shell: bash
        run: |
          shortcuts sign --mode anyone --input shortcuts/Threads_Downloader_V2_UNSIGNED_source.shortcut --output shortcuts/Threads_Downloader_V2_SIGNED.shortcut
          test -s shortcuts/Threads_Downloader_V2_SIGNED.shortcut
          file shortcuts/Threads_Downloader_V2_SIGNED.shortcut
      - name: Upload signed .shortcut as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: Threads-Downloader-V2-SIGNED
          path: shortcuts/Threads_Downloader_V2_SIGNED.shortcut
          if-no-files-found: error
          retention-days: 7
      - name: Publish signed file only on temporary branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- shortcuts/Threads_Downloader_V2_SIGNED.shortcut
          if ! git diff --cached --quiet; then
            git commit -m "build: add Apple-signed Threads Downloader V2"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
