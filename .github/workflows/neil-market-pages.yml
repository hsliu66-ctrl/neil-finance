name: Neil Auto Market Data and Pages
on:
  schedule:
    - cron: '15 0 * * 1-5' # 08:15 Taipei weekdays
    - cron: '30 1 * * 1'   # 09:30 Taipei Monday completed-week archive
  workflow_dispatch:
    inputs:
      archive_week:
        description: 'Also archive the last completed week'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: neil-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Obtain public official market observations
        env:
          WEEKLY: ${{ github.event.schedule == '30 1 * * 1' || inputs.archive_week }}
        run: |
          if [ "$WEEKLY" = 'true' ]; then
            python scripts/update_market.py --daily --weekly
          else
            python scripts/update_market.py --daily
          fi
      - name: Version verified market history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh official time series and weekly archive'
            git push origin HEAD:main
          fi
      - name: Assemble static pages
        run: |
          mkdir -p _site
          cp index.html article.html editor.html publish.html market.html archive.html 404.html _site/
          cp app.js editor.js reports.js market.js archive.js styles.css favicon.svg neil-logo.webp .nojekyll _site/
          cp -R data _site/data
          if [ -d assets ]; then cp -R assets _site/assets; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the site
        uses: actions/deploy-pages@v4
        id: deployment
