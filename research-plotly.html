<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plotly 美債殖利率互動圖｜Neil Financial Desk</title>
<link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" defer></script>
<style>body{margin:0;background:#f7f5ee;color:#142b36;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}main{max-width:1120px;margin:0 auto;padding:25px}a{color:#285b4d}h1{font-size:clamp(28px,5vw,46px)}p{line-height:1.85;color:#455e68;font-size:15px}.chart{background:#fffefa;min-height:530px;border:1px solid #d9dcd5}.status{font-size:14px;color:#285b4d;font-weight:700;margin:15px 0}footer{margin-top:32px;padding:20px 0;border-top:1px solid #d9dcd5;font-size:12px;color:#607078}@media(max-width:740px){main{padding:16px}.chart{min-height:440px}}</style></head>
<body><main><p><a href="index.html">← Neil Financial Desk</a>　/　<a href="research-lab.html">研究工具</a></p>
<h1>Plotly｜美國公債殖利率曲線</h1>
<p>資料來源：美國財政部 Daily Treasury Par Yield Curve Rates。只比較同一觀測日的 12 個公債天期，非即時行情。滑動或點擊曲線可查看各期殖利率。</p>
<div class="status" id="status">載入歷史資料中…</div><div class="chart" id="chart"></div>
<footer>📝 Neil 整理｜僅供資訊參考，非投資建議。圖表函式庫由 Plotly CDN 載入，可能需要網路連線。</footer>
</main><script>
window.addEventListener("load",async function(){
 const tenors=["1M","2M","3M","6M","1Y","2Y","3Y","5Y","7Y","10Y","20Y","30Y"];
 const status=document.getElementById("status"),box=document.getElementById("chart");
 try {
  const response=await fetch("data/history.json",{cache:"no-store"});
  if(!response.ok)throw Error("無法讀取 GitHub 歷史資料");
  const history=(await response.json()).series||{};
  const byTenor={};
  for (const t of tenors){
   byTenor[t]=new Map((history["UST_"+t]||[]).map(x=>[String(x.date),Number(x.value)]).filter(x=>Number.isFinite(x[1])));
  }
  const first=byTenor[tenors[0]];
  const shared=[...first.keys()].filter(day=>tenors.every(t=>byTenor[t].has(day))).sort();
  if(!shared.length){status.textContent="尚無 12 期同日完整官方資料。";box.textContent="請等待官方資料更新";return;}
  const last=shared[shared.length-1],prev=shared.length>=2?shared[shared.length-2]:null;
  const mk=(day,name)=>({x:tenors,y:tenors.map(t=>byTenor[t].get(day)),type:"scatter",mode:"lines+markers",name:name+"："+day,hovertemplate:"%{x}　%{y:.3f}%<extra></extra>",line:{width:3}});
  if(typeof Plotly==="undefined")throw Error("無法載入 Plotly 圖表函式庫");
  const traces=[mk(last,"最新")];
  if(prev){const p=mk(prev,"前期");p.line.dash="dot";p.line.width=2;traces.push(p);}
  await Plotly.newPlot(box,traces,{title:"U.S. Treasury · "+last,xaxis:{title:"到期期限"},yaxis:{title:"殖利率 (%)"},margin:{l:60,r:25,b:90,t:80},legend:{orientation:"h",y:-.25},paper_bgcolor:"#fffefa",plot_bgcolor:"#fffefa",font:{family:"Arial, Noto Sans TC, sans-serif"},hovermode:"x unified",responsive:true},{responsive:true,displaylogo:false});
  status.textContent="最新完整觀測日："+last+"｜歷史同日 12 期完整資料："+shared.length+" 日";
 }catch(e){status.textContent="圖表載入失敗："+e.message;box.textContent="資料尚不可用，請稍後重新整理。";}
});
</script></body></html>
